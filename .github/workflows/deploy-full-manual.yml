name: deploy full (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (must match the branch you run from)"
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-full-manual-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TERRAFORM_DIR: ./infra

jobs:
  deploy:
    name: deploy all
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment == 'prod' && 'prod' || inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Context
        id: set-env
        run: |
          case "${{ inputs.environment }}" in
            dev)
              echo "gh_env=development" >> "$GITHUB_OUTPUT"
              echo "tf_dir=infra/envs/dev" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "gh_env=staging" >> "$GITHUB_OUTPUT"
              echo "tf_dir=infra/envs/staging" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "gh_env=production" >> "$GITHUB_OUTPUT"
              echo "tf_dir=infra/envs/prod" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: ${{ inputs.environment }}" >&2
              exit 1
              ;;
          esac

      - name: Configure AWS credentials for Deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886601940523:role/splatial-${{ inputs.environment }}-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Install backend Lambda dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Terraform Init
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: terraform init

      - name: Terraform Apply deploy compute IAM policy
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          terraform apply -refresh=false -auto-approve \
            -target=module.static_site.aws_iam_policy.github_deploy_compute_policy \
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_compute \
            -target=module.static_site.time_sleep.compute_iam_propagation

      - name: Refresh AWS credentials after compute IAM policy update
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886601940523:role/splatial-${{ inputs.environment }}-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Apply deploy IAM policies
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          DEPLOY_IAM_TARGETS=(
            -target=module.static_site.aws_iam_policy.github_deploy_core_policy
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_core
            -target=module.static_site.time_sleep.iam_propagation
            -target=module.static_site.aws_iam_policy.github_deploy_storage_policy
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_storage
            -target=module.static_site.time_sleep.storage_iam_propagation
            -target=module.static_site.aws_iam_policy.github_deploy_compute_policy
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_compute
            -target=module.static_site.time_sleep.compute_iam_propagation
            -target=module.static_site.aws_iam_policy.github_deploy_network_policy
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_network
            -target=module.static_site.time_sleep.network_iam_propagation
            -target=module.static_site.aws_route.worker_spot_igw
            -target=module.static_site.aws_route.worker_spot_nat
            -target=module.static_site.aws_iam_policy.github_deploy_cdn_policy
            -target=module.static_site.aws_iam_role_policy_attachment.github_deploy_cdn
            -target=module.static_site.time_sleep.cdn_iam_propagation
          )
          terraform apply -refresh=false -auto-approve "${DEPLOY_IAM_TARGETS[@]}"

      - name: Refresh AWS credentials after IAM policy update
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886601940523:role/splatial-${{ inputs.environment }}-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Apply
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          set -euo pipefail
          echo "Planning infrastructure changes (full refresh)..."
          terraform plan -out=tfplan -input=false -no-color
          terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf
        working-directory: ${{ steps.set-env.outputs.tf_dir }}
        run: |
          {
            echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)"
            echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "site_url=$(terraform output -raw site_url)"
            echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)"
            echo "cognito_client_id=$(terraform output -raw cognito_client_id)"
            echo "api_endpoint=$(terraform output -raw api_endpoint)"
            echo "raw_scenes_bucket_name=$(terraform output -raw raw_scenes_bucket_name)"
            echo "scenes_table_name=$(terraform output -raw scenes_table_name)"
            echo "presence_ws_endpoint=$(terraform output -raw presence_ws_endpoint)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the Frontend artifacts
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_USER_POOL_ID: ${{ steps.tf.outputs.cognito_user_pool_id }}
          NEXT_PUBLIC_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          NEXT_PUBLIC_API_GATEWAY_URL: ${{ steps.tf.outputs.api_endpoint }}
          NEXT_PUBLIC_RAW_SCENES_BUCKET: ${{ steps.tf.outputs.raw_scenes_bucket_name }}
          NEXT_PUBLIC_SCENES_TABLE: ${{ steps.tf.outputs.scenes_table_name }}
          NEXT_PUBLIC_PRESENCE_WS_URL: ${{ steps.tf.outputs.presence_ws_endpoint }}

      - name: Sync Static Assets to S3
        working-directory: frontend
        run: |
          aws s3 sync ./out s3://${{ steps.tf.outputs.s3_bucket_name }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude ".terraform/*" \
            --exclude "*.tf" \
            --exclude "*.tfvars" \
            --exclude "README.md"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.cloudfront_distribution_id }} \
            --paths "/*"

      - name: Show deployed site URL
        run: |
          echo "Deployed to: ${{ steps.tf.outputs.site_url }}"
